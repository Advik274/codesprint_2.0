services:
  - type: web
    name: dominance
    runtime: node
    rootDir: .
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ZONE_PASSWORD
        sync: false
    plan: free
